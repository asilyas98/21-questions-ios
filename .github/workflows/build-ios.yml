name: Build for iOS App Store

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Generate the ios/ Xcode project from the Capacitor config
      - name: Add iOS platform & sync
        run: |
          npx cap add ios
          npx cap sync ios

      # ── Patch Podfile to disable code signing for Pod targets ──
      # Capacitor already adds a post_install block; we inject into it rather
      # than appending a second one (CocoaPods forbids multiple hooks).
      - name: Patch Podfile
        run: |
          ruby << 'RUBY_SCRIPT'
          podfile_path = 'ios/App/Podfile'
          content = File.read(podfile_path)

          signing_snippet = <<~SNIPPET
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                end
              end
          SNIPPET

          if content.match?(/^post_install/)
            # Inject our snippet right after the opening line of the existing hook
            content.sub!(/^(post_install do \|installer\|)/, "\\1\n#{signing_snippet}")
          else
            # No hook yet — append one
            content += "\npost_install do |installer|\n#{signing_snippet}end\n"
          end

          File.write(podfile_path, content)
          RUBY_SCRIPT
          cd ios/App && pod install

      # ── Import Distribution certificate ──
      - name: Import Apple certificate
        env:
          DIST_CERT_BASE64: ${{ secrets.APPLE_DIST_CERTIFICATE }}
          DIST_CERT_PASS: ${{ secrets.APPLE_DIST_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$DIST_CERT_BASE64" | base64 --decode > dist_cert.p12
          security import dist_cert.p12 \
            -k build.keychain \
            -P "$DIST_CERT_PASS" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" build.keychain

      # ── Install provisioning profile ──
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/e9235fb4-dff8-4875-a1d3-b52d6fde1f04.mobileprovision

      # ── Build & Archive ──
      - name: Build Xcode archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/21questions.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="21Questions AppStore" \
            -allowProvisioningUpdates

      # ── Export .ipa ──
      - name: Export .ipa
        run: |
          cat > $RUNNER_TEMP/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/21questions.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist $RUNNER_TEMP/export_options.plist

      # ── Upload .ipa to GitHub so you can download it ──
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21-questions-ios
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
